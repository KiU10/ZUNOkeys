<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZUNOkeys</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main id="app">
        <h1>ZUNOkeys</h1>
        <p>Dein 10-Finger-Schreibtrainer.</p>

        <section id="typing-container">
            <div id="lesson-info">
                <h2 id="lesson-title">Lektion 1</h2>
                <p id="lesson-description">Die Grundreihe kennenlernen.</p>
            </div>

            <div id="text-display"></div>

            <textarea
                id="typing-input"
                placeholder="Hier anfangen zu tippen..."
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
            ></textarea>

            <div id="stats">
                <p>WPM: <span id="wpm">0</span></p>
                <p>Genauigkeit: <span id="accuracy">100%</span></p>
                <p>Fehler: <span id="errors">0</span></p>
            </div>

            <button id="restart-button">Neu starten</button>
        </section>
    </main>

    <script src="js/lessons.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/typing.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
